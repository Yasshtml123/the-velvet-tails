services:
  - type: web
    name: the-velvet-tails-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACCESS_TOKEN_EXPIRES
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES
        value: 7d
      - key: FRONTEND_URL
        value: https://thevelvettails.com
      - key: ALLOWED_ORIGINS
        value: https://the-velvet-tails-8l1t.vercel.app
      - key: EMAIL_FROM
        value: "The Velvet Tails <noreply@thevelvettails.com>"
      - key: SHIPROCKET_PICKUP_LOCATION
        value: Primary
      
      # Auto-generated secure secrets
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      
      # Values you must provide in the Render Dashboard
      - key: MONGO_URI
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: PAYU_MERCHANT_KEY
        sync: false
      - key: PAYU_MERCHANT_SALT
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
